appId: net.tareitas
---
- scrollUntilVisible:
    element:
      id: users-add-child-button
    direction: DOWN
    timeout: 8000

- tapOn:
    id: users-add-child-button

- extendedWaitUntil:
    visible:
      id: child-form-screen
    timeout: 15000

- tapOn:
    id: child-form-username
- inputText: ${E2E_CHILD2_USERNAME}

# Never hideKeyboard on Android (system back closes the form). Tap next field before inputText.
- tapOn:
    id: child-form-name
- inputText: ${E2E_CHILD2_NAME}

- tapOn:
    id: child-form-password-button

- extendedWaitUntil:
    visible:
      id: child-form-password-pin-modal
    timeout: 10000

- tapOn:
    id: child-form-password-pin-slots
- inputText: ${E2E_CHILD2_PIN}

- tapOn:
    id: child-form-password-pin-save

- extendedWaitUntil:
    notVisible:
      id: child-form-password-pin-modal
    timeout: 5000

# Avatar is below password on the form — scroll to it and tap to select + dismiss keyboard.
- scrollUntilVisible:
    element:
      id: child-form-avatar-${E2E_CHILD2_AVATAR}
    direction: DOWN
    timeout: 8000

- tapOn:
    id: child-form-avatar-${E2E_CHILD2_AVATAR}

- scrollUntilVisible:
    element:
      id: child-form-save
    direction: DOWN
    timeout: 8000

- tapOn:
    id: child-form-save

- extendedWaitUntil:
    visible:
      id: users-screen
    timeout: 45000
