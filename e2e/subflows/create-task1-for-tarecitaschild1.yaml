appId: net.tareitas
---
- tapOn:
    id: tasks-add-button

- extendedWaitUntil:
    visible:
      id: task-assignment-add-screen
    timeout: 15000

- tapOn:
    id: task-assignment-children-select

- extendedWaitUntil:
    visible:
      id: task-assignment-children-select-menu
    timeout: 5000

- tapOn:
    id: task-assignment-child-${E2E_CHILD_USERNAME}

# Dismiss child menu — tap title, not children-select again (double-tap unchecks).
- tapOn:
    id: task-assignment-title

- extendedWaitUntil:
    notVisible:
      id: task-assignment-children-select-menu
    timeout: 5000

# Tap title again right before inputText — a wait between tap and input loses focus on Android.
- tapOn:
    id: task-assignment-title
- inputText: ${TASK_1_TITLE}

- tapOn:
    id: task-assignment-description
- inputText: Description

# Dismiss keyboard and select task avatar — never hideKeyboard (Android back).
- scrollUntilVisible:
    element:
      id: task-assignment-avatar-${TASK_1_AVATAR}
    direction: DOWN
    timeout: 8000

- tapOn:
    id: task-assignment-avatar-${TASK_1_AVATAR}

- assertVisible:
    id: task-assignment-add-screen

- scrollUntilVisible:
    element:
      id: task-assignment-save
    direction: DOWN
    timeout: 8000

- tapOn:
    id: task-assignment-save

# Reward is required — scroll up to error below reward input.
- scrollUntilVisible:
    element:
      id: task-assignment-reward-error
    direction: UP
    timeout: 8000

- assertVisible:
    id: task-assignment-reward-error
- assertVisible:
    id: task-assignment-add-screen

- tapOn:
    id: task-assignment-reward
- inputText: ${TASK_1_REWARD}

# Dismiss keyboard before save — tap avatar (description keeps keyboard open on Android).
- scrollUntilVisible:
    element:
      id: task-assignment-avatar-${TASK_1_AVATAR}
    direction: DOWN
    timeout: 8000

- tapOn:
    id: task-assignment-avatar-${TASK_1_AVATAR}

- scrollUntilVisible:
    element:
      id: task-assignment-save
    direction: DOWN
    timeout: 8000

- tapOn:
    id: task-assignment-save

- extendedWaitUntil:
    visible:
      id: tasks-screen
    timeout: 45000

- assertVisible:
    id: task-list-item-${TASK_1_TITLE}
- assertVisible:
    id: task-list-item-${TASK_1_TITLE}-status-pending
